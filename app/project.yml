# XcodeGen recipe for the Xcode project. The .xcodeproj is generated from this
# (on GitHub's Mac servers, or on a Mac with `xcodegen generate`), never edited by hand.
name: ZeroLog

options:
  bundleIdPrefix: com.getzerolog
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  ZeroLogCore:
    path: Packages/ZeroLogCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  ZeroLog:
    type: application
    platform: iOS
    sources:
      # The privacy manifest is declared explicitly as a resource. XcodeGen
      # infers build phases from file type, and a .xcprivacy left to inference
      # can end up in the wrong phase or be dropped -- which fails silently at
      # upload time rather than at build time.
      - path: ZeroLog
        excludes: ["PrivacyInfo.xcprivacy"]
      - path: Shared
      - path: ZeroLog/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ZeroLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getzerolog.app
        INFOPLIST_KEY_CFBundleDisplayName: ZeroLog
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        # The phone app reads workouts and bodyweight; it does not capture motion.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ZeroLog reads your workouts and bodyweight from Health so your plan reflects where you actually are."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "ZeroLog saves your lifting workouts to Health so they appear alongside your other activity."
    scheme:
      testTargets: [ZeroLogUITests]

  # Taps through the phone app and takes screenshots (see .github/workflows/screenshots.yml).
  ZeroLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ZeroLogUITests]
    dependencies:
      - target: ZeroLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getzerolog.app.uitests

  ZeroLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: ZeroLogWatch
        excludes: ["PrivacyInfo.xcprivacy"]
      - path: Shared
      # The watch is a separate bundle, so the phone's manifest does not cover
      # it. This one declares system boot time for rep counting.
      - path: ZeroLogWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ZeroLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getzerolog.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: ZeroLog
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.getzerolog.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "YES"
        # MANDATORY. Raw accelerometer streams have no permission-request API,
        # so a missing NSMotionUsageDescription does not produce a denial -- the
        # app CRASHES on first sensor access. App Review also rejects a binary
        # that merely contains code touching a protected resource without a
        # purpose string, even if that code never runs. Strings must be specific:
        # "This app needs your motion data" is rejected as too vague.
        INFOPLIST_KEY_NSMotionUsageDescription: "ZeroLog reads your wrist movement during a workout to count your reps, so you never have to type a set."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ZeroLog reads your workouts from Health so your training history stays in one place."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "ZeroLog saves your lifting workouts to Health so they appear alongside your other activity."
        # Keeps the app sampling while the wrist is down. Without a workout
        # session watchOS suspends the app mid-set and the set is lost.
        INFOPLIST_KEY_WKBackgroundModes: workout-processing
    entitlements:
      path: ZeroLogWatch/ZeroLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme: {}
