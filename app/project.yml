# XcodeGen recipe for the Xcode project. The .xcodeproj is generated from this
# (on GitHub's Mac servers, or on a Mac with `xcodegen generate`), never edited by hand.
name: ZeroLog

options:
  bundleIdPrefix: com.getzerolog
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  ZeroLogCore:
    path: Packages/ZeroLogCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  ZeroLog:
    type: application
    platform: iOS
    sources: [ZeroLog, Shared]
    dependencies:
      - package: ZeroLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getzerolog.app
        INFOPLIST_KEY_CFBundleDisplayName: ZeroLog
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}

  ZeroLogWatch:
    type: application
    platform: watchOS
    sources: [ZeroLogWatch, Shared]
    dependencies:
      - package: ZeroLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getzerolog.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: ZeroLog
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.getzerolog.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "YES"
    scheme: {}
