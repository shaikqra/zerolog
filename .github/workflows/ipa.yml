# Builds an installable, UNSIGNED .ipa of the phone app and publishes it.
#
# Why this exists: the founder has no Mac and no paid Apple Developer account
# until his 18th birthday, so TestFlight and Xcode free-provisioning are both
# shut. A Windows sideloading tool (Sideloadly, AltStore) CAN install an app onto
# his own iPhone using a free Apple ID — it re-signs the bundle locally — but it
# needs an .ipa to start from, and nothing was producing one.
#
# This is viable only because the phone target is clean:
#   - NO entitlements block (no HealthKit capability), so nothing here requires a
#     paid team. Verified in project.yml.
#   - It does NOT embed the watch app; its only dependency is the ZeroLogCore
#     package. Extension-bearing and watch-embedding builds are the known
#     failure case for free-Apple-ID sideloading.
#   - It calls neither HealthKit nor CoreMotion, so there is no entitlement it
#     would hit at runtime and crash on.
# If any of those three change, re-check before promising an install.
#
# Built RELEASE on purpose. Besides being the right thing to install, it is the
# only job that compiles the release configuration at all — which is where an
# unguarded `#if DEBUG` reference would surface, and the alternative place to
# discover that is an App Store upload.
name: Installable phone build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/Packages/**"
      - ".github/workflows/ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      # A DEVICE build (arm64), not a simulator build. A simulator binary will
      # not install on a phone, and the failure mode is a confusing one.
      - name: Build the phone app for a real device, unsigned
        working-directory: app
        run: |
          set -uo pipefail
          mkdir -p ../docs/ci
          set +e
          xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLog \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -400 > ../docs/ci/ipa-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:" ../docs/ci/ipa-build.log | sort -u | head -40 \
            > ../docs/ci/ipa-build-errors.txt || true
          echo "--- errors ---"; cat ../docs/ci/ipa-build-errors.txt
          exit $STATUS

      # An .ipa is just a zip with the .app inside a folder called Payload.
      - name: Package it as an .ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "no device .app was produced"
            find build/Build/Products -maxdepth 2 -name '*.app' || true
            exit 1
          fi
          echo "app: $APP"
          # Confirm it is a DEVICE binary. A simulator slice here would install
          # nowhere and the error on the phone would not say why.
          if ! lipo -archs "$APP/ZeroLog" | grep -q arm64; then
            echo "not an arm64 device binary: $(lipo -archs "$APP/ZeroLog")"
            exit 1
          fi
          rm -rf ../ipa && mkdir -p ../ipa/Payload
          cp -R "$APP" ../ipa/Payload/
          # Sideloading tools re-sign the bundle, so any stale signature must go.
          rm -rf ../ipa/Payload/*.app/_CodeSignature
          cd ../ipa && zip -qry ZeroLog-unsigned.ipa Payload
          ls -lh ZeroLog-unsigned.ipa
          unzip -l ZeroLog-unsigned.ipa | head -5

      # Force-pushed orphan branch, so only the newest build exists and main is
      # never polluted with binaries.
      - name: Publish the .ipa
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cp ipa/ZeroLog-unsigned.ipa "$WORK/"
          cat > "$WORK/README.md" <<EOF
          # ZeroLog phone app, installable

          Built from commit ${GITHUB_SHA::7} (Release, unsigned, arm64 device).

          Download: [ZeroLog-unsigned.ipa](https://github.com/${{ github.repository }}/raw/ipa/ZeroLog-unsigned.ipa)

          Install it with Sideloadly or AltStore on Windows using a FREE Apple ID.
          The tool signs it on your PC; the file here is deliberately unsigned.

          Limits of a free Apple ID: the app stops opening after 7 days and must
          be reinstalled, and you can have 3 sideloaded apps at once.

          This is the PHONE app only. The Apple Watch app cannot be sideloaded —
          watchOS apps need a paid Apple Developer account, so rep counting
          cannot be tested this way.
          EOF
          cd "$WORK"
          git init -q
          git config user.name "zerolog-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ipa
          git add .
          git commit -q -m "Phone app from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ipa
          echo "published"

      - name: Commit the build log
        if: always()
        run: |
          set -euo pipefail
          git config user.name "zerolog-ci"
          git config user.email "ci@users.noreply.github.com"
          git add docs/ci || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "ipa build log for ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi
