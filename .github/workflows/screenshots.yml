# Photographs and RECORDS the app, then commits what it produced.
#
# Why committed rather than uploaded as artifacts: artifact downloads need an
# authenticated API call, so neither the founder (who would have to dig through
# the Actions UI) nor the CTO agent (whose deploy key has no API access) can
# actually look at them. Files in docs/screens/ render directly on GitHub and are
# readable over raw.githubusercontent.com with no login.
#
# Stills and video are captured FROM THE HOST with simctl while xcodebuild drives
# the app, rather than pulled out of the .xcresult bundle. The xcresult route was
# tried first and produced NOTHING: `xcresulttool export attachments` has changed
# across Xcode versions, and the failure was invisible because the step carried
# continue-on-error. simctl screenshot/recordVideo needs no parsing, is stable
# across Xcode releases, and yields a video of the app being used as a bonus.
#
# NO continue-on-error anywhere in this file. It makes a FAILED step report
# `conclusion: success` through the API, which hid the broken extraction for a
# whole run and sent the diagnosis in the wrong direction.
name: Screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screens/**"      # never photograph a commit that was just photos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      # ---------------------------------------------------------------- phone
      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      best = d['udid']
          print(best or '')
          ")
          if [ -z "$UDID" ]; then echo "no iPhone simulator available"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Record and photograph the phone app while the tests drive it
        working-directory: app
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          # Delete last run's frames FIRST. Without this, old frames survive
          # (each run writes frame-NN.png but never removes leftovers) and sit
          # alongside the new ones, indistinguishable. A two-build-old frame
          # then reads as current evidence -- it already cost one wrong
          # diagnosis of a fix that had actually worked.
          rm -rf ../docs/screens/phone
          mkdir -p ../docs/screens/phone ../media

          # Video of the whole run, for a human to watch.
          xcrun simctl io "$UDID" recordVideo --codec h264 --force ../media/phone-tour.mp4 &
          REC=$!

          # Stills every 2s, so there is something to look at without a video
          # player, and something an agent can read as images.
          (
            i=0
            while [ $i -lt 90 ]; do
              xcrun simctl io "$UDID" screenshot \
                "$(printf '../docs/screens/phone/frame-%02d.png' $i)" >/dev/null 2>&1 || true
              i=$((i + 1))
              sleep 2
            done
          ) &
          SHOTS=$!

          set +e
          xcodebuild test -project ZeroLog.xcodeproj -scheme ZeroLog \
            -destination "id=$UDID" \
            -only-testing:ZeroLogUITests/ScreenshotTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO -quiet
          TEST_STATUS=$?
          set -e

          kill "$SHOTS" 2>/dev/null || true
          # SIGINT, not SIGKILL: recordVideo must finalise the container or the
          # mp4 is unplayable.
          kill -INT "$REC" 2>/dev/null || true
          wait "$REC" 2>/dev/null || true

          echo "xcodebuild test exited $TEST_STATUS"
          ls -la ../media/ || true
          echo "stills captured: $(ls ../docs/screens/phone/*.png 2>/dev/null | wc -l)"

      # Identical consecutive frames are worthless and would bloat the repo.
      - name: Drop duplicate frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          folder = pathlib.Path("docs/screens/phone")
          previous = None
          kept = 0
          for shot in sorted(folder.glob("frame-*.png")):
              digest = hashlib.sha256(shot.read_bytes()).hexdigest()
              if digest == previous:
                  shot.unlink()
              else:
                  previous = digest
                  kept += 1
          print(f"kept {kept} distinct frames")
          PY

      # ---------------------------------------------------------------- watch
      # watchOS has NO UI-testing support, so nothing can tap through a watch
      # app. simctl can install, launch and screenshot it; what it cannot do is
      # tap. So a DEBUG-only launch argument puts the app straight into one
      # screen, one launch per screen.
      # Compile errors are written INTO THE REPO, because GitHub requires a
      # sign-in to read Actions logs even on a public repository. Without this
      # the only signal reaching the agent is "exit code 65", which says a
      # compile failed and nothing about where. Committing the error lines turns
      # a blind guess into a one-line diagnosis.
      - name: Build the watch app for the simulator
        working-directory: app
        run: |
          set -uo pipefail
          mkdir -p ../docs/ci
          set +e
          xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLogWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -400 > ../docs/ci/watch-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -E "error:|warning: .*actor" ../docs/ci/watch-build.log \
            | sort -u | head -40 > ../docs/ci/watch-build-errors.txt || true
          echo "--- errors ---"; cat ../docs/ci/watch-build-errors.txt
          exit $STATUS

      - name: Photograph every watch screen
        run: |
          set -uo pipefail
          rm -rf docs/screens/watch   # same stale-frame rule as the phone
          mkdir -p docs/screens/watch
          APP=$(find app/build/Build/Products -name 'ZeroLogWatch.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then echo "watch app not found"; exit 1; fi
          echo "watch app: $APP"

          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              if 'watchOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable'):
                      print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "watch simulator: $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"

          BUNDLE=com.getzerolog.app.watchkitapp
          SCREENS="start notsetup consent set dimmed card diagnostics selftest summary"
          mkdir -p docs/ci
          : > docs/ci/watch-capture-errors.txt
          shot=0; missed=""

          for screen in $SCREENS; do
            ok=0
            # Two attempts. The simulator gets unreliable after a run of
            # launch/terminate cycles -- the previous version silently lost
            # every screen from the fifth onward, which only became visible
            # once stale files stopped being left behind to hide it.
            for attempt in 1 2; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 2   # terminate is async; launching into a dying process fails
              if xcrun simctl launch "$UDID" "$BUNDLE" -previewScreen "$screen"; then
                sleep 6   # let SwiftUI lay out and the self-test finish
                if xcrun simctl io "$UDID" screenshot "docs/screens/watch/$screen.png"; then
                  ok=1; break
                fi
              fi
              echo "attempt $attempt failed for $screen" >> docs/ci/watch-capture-errors.txt
              # Give the simulator a chance to recover before trying again.
              xcrun simctl shutdown "$UDID" 2>/dev/null || true
              xcrun simctl boot "$UDID" 2>/dev/null || true
              xcrun simctl bootstatus "$UDID" -b 2>/dev/null || true
            done
            if [ "$ok" = "1" ]; then
              shot=$((shot + 1)); echo "captured $screen"
            else
              missed="$missed $screen"; echo "MISSED $screen"
            fi
          done

          total=$(echo $SCREENS | wc -w | tr -d " ")
          echo "watch screenshots: $shot of $total"
          if [ -n "$missed" ]; then
            echo "missed screens:$missed" >> docs/ci/watch-capture-errors.txt
          fi
          # A PARTIAL capture must fail. The old guard accepted anything above
          # zero, so losing four of eight screens reported success and the gap
          # was only noticed by counting files by hand days later.
          [ "$shot" = "$total" ]

      # ----------------------------------------------------------------- index
      - name: Build an index page
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, datetime, os
          root = pathlib.Path("docs/screens")
          sha = (os.environ.get("GITHUB_SHA") or "")[:7]
          lines = ["# ZeroLog, as it actually looks", "",
                   f"Generated from commit `{sha}` on {datetime.date.today().isoformat()} "
                   "by `.github/workflows/screenshots.yml`.", "",
                   "Phone frames are captured from the host every 2 seconds while the "
                   "UI tests drive the real app, with identical consecutive frames "
                   "removed. Watch screens are each launched directly, because watchOS "
                   "cannot be UI-tested; the plans shown come from the real engine, "
                   "not mock-ups.", "",
                   "Video of the phone run (force-pushed to the `media` branch, newest "
                   "only): "
                   "[phone-tour.mp4](https://github.com/shaikqra/zerolog/raw/media/phone-tour.mp4)",
                   ""]
          for section, title in [("watch", "Apple Watch"), ("phone", "iPhone")]:
              folder = root / section
              shots = sorted(folder.glob("*.png")) if folder.exists() else []
              lines += [f"## {title}", ""]
              if not shots:
                  lines += ["_Nothing captured this run._", ""]
                  continue
              for shot in shots:
                  lines += [f"### {shot.stem}", "",
                            f"![{shot.stem}]({section}/{shot.name})", ""]
          root.mkdir(parents=True, exist_ok=True)
          (root / "README.md").write_text("\n".join(lines))
          print(f"index written, {len(lines)} lines")
          PY

      - name: Commit the pictures
        if: always()
        run: |
          set -euo pipefail
          git config user.name "zerolog-ci"
          git config user.email "ci@users.noreply.github.com"
          # -A, not plain add: deletions must be staged too, otherwise frames
          # removed above stay in the repo and the stale-frame bug returns via
          # git rather than via the filesystem.
          git add -A docs/screens docs/ci 2>/dev/null || git add -A docs/screens
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -q -m "Screenshots from ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi

      # The video goes to an ORPHAN branch, force-pushed every time, so only the
      # latest file ever exists. Committing multi-megabyte binaries to main would
      # bloat the history permanently and irreversibly.
      - name: Publish the video to the media branch
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s media/phone-tour.mp4 ]; then
            echo "no video to publish"; exit 0
          fi
          ls -lh media/phone-tour.mp4
          WORK=$(mktemp -d)
          cp media/phone-tour.mp4 "$WORK/"
          cd "$WORK"
          git init -q
          git config user.name "zerolog-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b media
          git add phone-tour.mp4
          git commit -q -m "Phone tour video from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            media
          echo "published to the media branch"
