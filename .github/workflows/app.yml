# Builds the iPhone + Watch app on GitHub's Mac servers.
#
# macOS minutes bill at 10x, so this workflow does ONLY what needs Xcode.
# The exercise-database check and the 36 engine tests moved to core-tests.yml
# on a Linux runner (1x billing) -- the core package is Foundation-only and
# needs no Mac.
#
# `!app/Packages/**` is the important bit: editing the engine no longer starts
# a Mac build, because Linux already compiled and tested it.
name: App build

# Needed by the diagnosis-commit step; without it the default token is
# read-only and the push fails with the diagnosis still on the runner.
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/Packages/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:                      # never pay for a superseded commit
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build iPhone app
        working-directory: app
        run: >
          xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLog
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Build Watch app
        working-directory: app
        run: >
          xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLogWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO -quiet build

      # Taps through the real app on a simulator and asserts what it DOES: a
      # logged set reaches history with the right numbers, history survives a
      # relaunch, an automatic change explains itself and undoes, and no screen
      # shames the user. Until now nothing had ever tapped a button except a
      # human looking at screenshots, so no UI regression was caught
      # automatically.
      #
      # Only the behaviour tests run here. The screenshot tour stays on manual
      # dispatch: it is slow, and its output is images for a human rather than
      # an assertion.
      - name: Run phone behaviour tests
        working-directory: app
        run: |
          set -uo pipefail
          # Pick a concrete simulator rather than hardcoding a device name that
          # a future runner image may not have.
          DEST=$(xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLog \
                   -showdestinations 2>/dev/null \
                 | grep 'platform:iOS Simulator' \
                 | grep -vi 'placeholder\|Any iOS' \
                 | head -1 \
                 | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          if [ -z "$DEST" ]; then
            echo "No iOS simulator destination found"
            xcodebuild -project ZeroLog.xcodeproj -scheme ZeroLog -showdestinations
            exit 1
          fi
          echo "Testing on simulator id=$DEST"
          # Per-test execution cap. The first run of these tests HUNG and ate the
          # job's full 30 minutes, which told us nothing about which test was at
          # fault. A hung UI test must fail as a test, not as a dead job.
          # No -quiet, no silent failure: this step failed three commits in a
          # row with its reason readable only behind a GitHub sign-in. The
          # failing tests' own lines are committed to docs/ci (same contract
          # as every other diagnostic), and cloning is off so the tests run
          # on the SAME simulator a human or a recorder would be watching.
          set +e
          xcodebuild test -project ZeroLog.xcodeproj -scheme ZeroLog \
            -destination "id=$DEST" -derivedDataPath build \
            -only-testing:ZeroLogUITests/BehaviourTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee behaviour-tests.log | tail -5
          STATUS=${PIPESTATUS[0]}
          set -e
          mkdir -p ../docs/ci
          if [ "$STATUS" -ne 0 ]; then
            grep -E "Test Case .* (failed|passed)|error:|Assertion Failure|exceeded.*time allowance" behaviour-tests.log \
              | tail -40 > ../docs/ci/behaviour-test-errors.txt || true
            [ -s ../docs/ci/behaviour-test-errors.txt ] || tail -40 behaviour-tests.log > ../docs/ci/behaviour-test-errors.txt
          else
            : > ../docs/ci/behaviour-test-errors.txt
          fi
          exit $STATUS

      # The diagnosis must survive the runner. Same contract as the other
      # workflows: an empty file is a pass, a non-empty one carries the
      # failing tests' own lines, readable by anyone without a sign-in.
      - name: Commit the behaviour-test diagnosis
        if: always()
        run: |
          set -euo pipefail
          git config user.name "zerolog-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A docs/ci 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -q -m "behaviour test log for ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi

      # A privacy manifest that exists in the repo but not in the BUNDLE is
      # worth nothing: App Store Connect refuses the upload, and the only
      # symptom is a rejection email weeks later. Checking the built product is
      # the only check that means anything.
      - name: Check privacy manifests reached the app bundles
        working-directory: app
        run: |
          set -uo pipefail
          fail=0
          found=0
          for app in build/Build/Products/*/*.app; do
            [ -d "$app" ] || continue
            found=$((found + 1))
            manifest="$app/PrivacyInfo.xcprivacy"
            if [ ! -f "$manifest" ]; then
              echo "MISSING from bundle: $manifest"
              fail=1
              continue
            fi
            plutil -lint "$manifest" || fail=1
            echo "--- $manifest ---"
            plutil -p "$manifest"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .app bundles found; the check did not actually run"
            exit 1
          fi
          # Rep counting reads CMLogItem.timestamp, which is seconds since boot,
          # so the watch bundle must declare it or the upload is refused.
          watch=$(ls -d build/Build/Products/*/ZeroLogWatch.app 2>/dev/null | head -1)
          if [ -n "$watch" ]; then
            plutil -p "$watch/PrivacyInfo.xcprivacy" \
              | grep -q "NSPrivacyAccessedAPICategorySystemBootTime" \
              || { echo "watch manifest is missing the SystemBootTime declaration"; fail=1; }
          else
            echo "ZeroLogWatch.app not found; cannot verify the watch manifest"
            fail=1
          fi
          exit $fail
